name: Payment Service CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main


jobs:

  # =========================
  # CI: TEST
  # =========================
  test:
    name: Test Payment Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # =========================
  # BUILD AND PUSH DOCKER IMAGE
  # =========================
  docker:
    name: Build and Push Payment Docker Image
    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.ref_name }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }}